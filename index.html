<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C字動態反應測驗</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    background: white;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.1);
}

h1 { color: #2c3e50; }

p {
    color: #555;
    font-size: 18px;
    line-height: 1.8;
}

button {
    padding: 15px 30px;
    border: 0;
    border-radius: 8px;
    background: #3498db;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.hidden { display: none !important; }

#game-area {
    position: fixed;
    inset: 0;
    display: none;
    overflow: hidden;
    background: #061a36;
}

#question-counter {
    position: absolute;
    top: 20px;
    left: 24px;
    color: white;
    font-size: 24px;
    font-weight: bold;
}

#countdown-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 120px;
    font-weight: bold;
}

#stimulus-display {
    position: absolute;
    width: 180px;
    height: 180px;
    transform: translate(-50%, -50%);
}

.key-hint {
    display: inline-block;
    margin: 4px;
    padding: 4px 10px;
    background: #e0e0e0;
    color: #333;
    border-radius: 6px;
    font-weight: bold;
}

#stats {
    margin: 20px 0;
    color: #e67e22;
    font-size: 20px;
    font-weight: bold;
    line-height: 2;
}
</style>
</head>
<body>

<div class="container" id="welcome-screen">
    <h1>C字動態反應測驗</h1>
    <p>
        判斷 C 字缺口方向，並按下對應方向鍵。<br><br>
        <span class="key-hint">← 左</span>
        <span class="key-hint">↑ 上</span>
        <span class="key-hint">→ 右</span>
        <span class="key-hint">↓ 下</span>
        <br><br>
        共 20 題，作答後自動進入下一題。
    </p>
    <button id="start-button">開始測驗</button>
</div>

<div id="game-area">
    <div id="question-counter">目前題數：0 / 20</div>
    <div id="countdown-display" class="hidden">3</div>

    <svg id="stimulus-display" class="hidden"
         viewBox="0 0 100 100">
        <defs>
            <mask id="c-mask">
                <rect width="100" height="100" fill="black"/>
                <circle cx="50" cy="50" r="40" fill="white"/>
                <circle cx="50" cy="50" r="20" fill="black"/>
                <rect x="60" y="40" width="30" height="20" fill="black"/>
            </mask>
        </defs>
        <rect width="100" height="100"
              fill="white" mask="url(#c-mask)"/>
    </svg>
</div>

<div class="container hidden" id="result-screen">
    <h1>測驗結束</h1>
    <p id="result-text">感謝您的參與。</p>
    <div id="stats">
        <div id="avg-time">平均反應時間：0 毫秒</div>
        <div id="accuracy">正確率：0%</div>
    </div>
    <button id="restart-button">重新測驗</button>
</div>

<script>
(function () {
    "use strict";

    const TOTAL = 20;
    const DISPLAY_TIME = 800;

    const directions = [
        { rotation: 180, key: "ArrowLeft" },
        { rotation: 270, key: "ArrowUp" },
        { rotation: 0, key: "ArrowRight" },
        { rotation: 90, key: "ArrowDown" }
    ];

    const welcome = document.getElementById("welcome-screen");
    const game = document.getElementById("game-area");
    const result = document.getElementById("result-screen");
    const counter = document.getElementById("question-counter");
    const countdown = document.getElementById("countdown-display");
    const stimulus = document.getElementById("stimulus-display");

    let round = 0;
    let correct = 0;
    let reactionTimes = [];
    let trials = [];
    let current = null;
    let startTime = 0;
    let accepting = false;
    let running = false;
    let mainTimer = null;
    let stimulusTimer = null;
    let gameId = 0;

    function clearTimers() {
        if (mainTimer !== null) {
            clearTimeout(mainTimer);
            mainTimer = null;
        }
        if (stimulusTimer !== null) {
            clearTimeout(stimulusTimer);
            stimulusTimer = null;
        }
    }

    function later(callback, delay, id) {
        mainTimer = setTimeout(function () {
            mainTimer = null;
            if (!running || id !== gameId) return;
            callback();
        }, delay);
    }

    function hideC() {
        stimulus.classList.add("hidden");
    }

    function makeTrials() {
        const list = [];

        for (let i = 0; i < 5; i++) {
            directions.forEach(function (d) {
                list.push(d);
            });
        }

        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = list[i];
            list[i] = list[j];
            list[j] = temp;
        }

        return list;
    }

    function startGame() {
        clearTimers();
        gameId++;

        round = 0;
        correct = 0;
        reactionTimes = [];
        current = null;
        accepting = false;
        running = true;
        trials = makeTrials();

        welcome.classList.add("hidden");
        result.classList.add("hidden");
        game.style.display = "block";
        hideC();

        counter.textContent = "目前題數：0 / " + TOTAL;

        countdown.textContent = "3";
        countdown.classList.remove("hidden");

        const id = gameId;
        let number = 3;

        function tick() {
            number--;

            if (number > 0) {
                countdown.textContent = String(number);
                later(tick, 1000, id);
            } else {
                countdown.classList.add("hidden");
                nextRound(id);
            }
        }

        later(tick, 1000, id);
    }

    function nextRound(id) {
        if (!running || id !== gameId) return;

        accepting = false;

        if (stimulusTimer !== null) {
            clearTimeout(stimulusTimer);
            stimulusTimer = null;
        }

        hideC();

        if (round >= TOTAL) {
            endGame();
            return;
        }

        round++;
        counter.textContent =
            "目前題數：" + round + " / " + TOTAL;

        later(function () {
            showC(id);
        }, 1000 + Math.random() * 1000, id);
    }

    function showC(id) {
        if (!running || id !== gameId) return;

        current = trials[round - 1];

        const margin = 110;
        const maxX = Math.max(margin, window.innerWidth - margin);
        const maxY = Math.max(margin, window.innerHeight - margin);

        const x = margin + Math.random() * (maxX - margin);
        const y = margin + Math.random() * (maxY - margin);

        stimulus.style.left = x + "px";
        stimulus.style.top = y + "px";
        stimulus.style.transform =
            "translate(-50%, -50%) rotate(" +
            current.rotation + "deg)";

        stimulus.classList.remove("hidden");
        startTime = performance.now();
        accepting = true;

        stimulusTimer = setTimeout(function () {
            stimulusTimer = null;

            if (!running || !accepting || id !== gameId) return;

            accepting = false;
            hideC();
            later(function () {
                nextRound(id);
            }, 200, id);
        }, DISPLAY_TIME);
    }

    function handleKey(event) {
        if (!running || !accepting) return;

        const keys = [
            "ArrowLeft", "ArrowRight",
            "ArrowUp", "ArrowDown"
        ];

        if (!keys.includes(event.key)) return;

        event.preventDefault();
        accepting = false;

        if (stimulusTimer !== null) {
            clearTimeout(stimulusTimer);
            stimulusTimer = null;
        }

        const elapsed = Math.round(performance.now() - startTime);

        if (event.key === current.key) {
            correct++;
            reactionTimes.push(elapsed);
        }

        hideC();

        const id = gameId;
        later(function () {
            nextRound(id);
        }, 200, id);
    }

    function endGame() {
        clearTimers();
        running = false;
        accepting = false;

        hideC();
        countdown.classList.add("hidden");
        game.style.display = "none";
        result.classList.remove("hidden");

        const accuracy = Math.round(correct / TOTAL * 100);
        const average = reactionTimes.length
            ? Math.round(
                reactionTimes.reduce(function (a, b) {
                    return a + b;
                }, 0) / reactionTimes.length
            )
            : 0;

        document.getElementById("avg-time").textContent =
            "平均反應時間：" + average + " 毫秒";

        document.getElementById("accuracy").textContent =
            "正確率：" + accuracy + "% (" + correct + "/" + TOTAL + ")";

        document.getElementById("result-text").textContent =
            "測驗完成，感謝您的參與。";
    }

    document.getElementById("start-button")
        .addEventListener("click", startGame);

    document.getElementById("restart-button")
        .addEventListener("click", startGame);

    document.addEventListener("keydown", handleKey);
})();
</script>

</body>
</html>
